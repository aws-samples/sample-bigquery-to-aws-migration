# No `select` here, so the active rule set is ruff's built-in default — which is
# version-dependent (0.15: 59 rules, 0.16: 405). That is why the ruff version is
# pinned exactly in pyproject.toml [dev] and .gitlab-ci.yml; bumping it is a
# deliberate act that may surface new rules. If the team later wants the standard
# written down independently of upstream defaults, add an explicit `select`.
[lint]
ignore = [
    "BLE001",   # bare Exception in CLI/collector is intentional graceful degradation
    "DTZ001",   # datetime() without tzinfo — test fixtures use naive datetimes
    "DTZ003",   # utcnow() — legacy pattern, not user-facing
    "DTZ005",   # datetime.now() without tz — test fixtures
    "DTZ007",   # strptime without %z — test fixtures parsing known formats
    "S112",     # try-except-continue in collector scan loops is intentional
    "PERF402",  # list copy style preference
    "RUF012",   # mutable class default in test dataclass
]
