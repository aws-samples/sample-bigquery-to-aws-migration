[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bq-assess"
# Keep in step with src/bq_assess/__init__.py and packaging/collector/pyproject.toml.
# tests/unit/test_version_consistency.py enforces it — nothing did before 0.9.0.
version = "0.9.0"
description = "Read-only BigQuery migration assessment CLI: profiles a Source and assesses migrating it to an AWS lakehouse (S3 Tables / Apache Iceberg storage, Amazon Redshift Serverless query engine)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "google-cloud-bigquery>=3.11",
    "google-cloud-monitoring>=2.16",
    "sqlglot>=25.0,<31",
]

[project.scripts]
bq-assess = "bq_assess.cli:main"
bq-collect = "bq_assess.collect_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
    "pytest-cov>=4.1",
    # Exact pin, not a floor: ruff's DEFAULT rule set changed between 0.15 and
    # 0.16 (59 enabled rules -> 405), so a floor would let local and CI disagree
    # about what passes. Must match the pin in .gitlab-ci.yml's lint job.
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The HTML report templates ship as data files — without this the wheel renders
# JSON fine but dies on TemplateNotFound (dev editable installs mask it).
"bq_assess.report" = ["templates/*.j2"]
bq_assess = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "scale: petabyte-scale E2E harness (slow, ~1 min) — run with `pytest -m scale`",
]
addopts = "-m 'not scale'"
